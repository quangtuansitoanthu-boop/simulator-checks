name: iOS media services reset regression
'on':
  push:
    branches:
    - codex/ios-qa-20261119-1gh4bo0
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 65
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: npm
    - name: Verify Apple toolchain
      run: |
        xcodebuild -version
        pod --version
    - name: Install locked dependencies
      run: npm ci
    - name: Verify and sync the latest iOS asset bundle
      run: |-
        set -euo pipefail
        echo 'cccb225cb387d8ffac89e62a3893bb0ddd2fa8d556d6d8520d9fdd9301565405  ios/App/App/public/mobile-assets-manifest.json' | shasum -a 256 -c
        grep -Fq '1gh4bo0' ios/App/App/public/index.html
        mkdir -p build
        cp -R ios/App/App/public/. build/
        VITE_GOOGLE_IOS_CLIENT_ID="$(python3 - <<'PY'
        import plistlib
        with open('ios/App/App/Info.plist', 'rb') as info:
            plist = plistlib.load(info)
        scheme = next(value for row in plist['CFBundleURLTypes'] if row.get('CFBundleURLName') == 'GoogleSignIn' for value in row['CFBundleURLSchemes'])
        prefix = 'com.googleusercontent.apps.'
        assert scheme.startswith(prefix)
        print(scheme.removeprefix(prefix) + '.apps.googleusercontent.com')
        PY
        )" npx cap sync ios
        echo 'cccb225cb387d8ffac89e62a3893bb0ddd2fa8d556d6d8520d9fdd9301565405  ios/App/App/public/mobile-assets-manifest.json' | shasum -a 256 -c
    - name: Isolate production hosts before native simulator UI tests
      run: |
        set -euo pipefail
        mkdir -p build/release-evidence
        python3 - <<'PY'
        import json, os, pathlib, re, subprocess
        proxy=subprocess.check_output(['scutil','--proxy'],text=True)
        assert not re.search(r'(?:HTTPEnable|HTTPSEnable|SOCKSEnable|ProxyAutoConfigEnable|ProxyAutoDiscoveryEnable)\s*:\s*1\b',proxy), 'Proxy-enabled runner cannot prove production host isolation'
        assert not any(value for key,value in os.environ.items() if key.lower() in ('http_proxy','https_proxy','all_proxy')), 'Proxy environment must be disabled for native UI isolation'
        hosts=set(json.loads(pathlib.Path('qa-production-hosts.json').read_text()))
        assert {'quangtu.vn','quangtu-web.quangtu-ansitoanthu.workers.dev','quangtu.vercel.app'}.issubset(hosts), 'Expected native origins and legacy alias are missing'
        assert all(re.fullmatch(r'[a-z0-9.-]+',host) for host in hosts)
        backup=pathlib.Path(os.environ['RUNNER_TEMP'])/'tutam-native-qa-hosts.backup'
        assert not backup.exists(), 'Refusing to replace a previous hosts backup'
        original=pathlib.Path('/etc/hosts').read_bytes()
        backup.write_bytes(original)
        lines=[]
        for line in original.decode().splitlines():
            address,separator,comment=line.partition('#')
            parts=address.split()
            if len(parts)>1 and any(host.lower() in hosts for host in parts[1:]):
                aliases=[host for host in parts[1:] if host.lower() not in hosts]
                if aliases:
                    lines.append(parts[0]+'\t'+' '.join(aliases)+((' #'+comment) if separator else ''))
                elif separator:
                    lines.append('#'+comment)
            else:
                lines.append(line)
        lines.append('# Tu Tap native CI: production-host isolation, not full offline mode')
        for host in sorted(hosts):
            lines.extend(['127.0.0.1\t'+host,'::1\t'+host])
        subprocess.run(['sudo','tee','/etc/hosts'],input='\n'.join(lines)+'\n',text=True,check=True,stdout=subprocess.DEVNULL)
        pathlib.Path('build/release-evidence/production-hosts.json').write_text(json.dumps(sorted(hosts),indent=2))
        PY
        sudo dscacheutil -flushcache
        python3 - <<'PY'
        import ipaddress, json, os, pathlib, socket
        hosts=json.loads(pathlib.Path('build/release-evidence/production-hosts.json').read_text())
        proof={}
        for host in hosts:
            proof[host]={}
            for family,name in [(socket.AF_INET,'ipv4'),(socket.AF_INET6,'ipv6')]:
                addresses=sorted({entry[4][0] for entry in socket.getaddrinfo(host,443,family,socket.SOCK_STREAM)})
                assert addresses and all(ipaddress.ip_address(address).is_loopback for address in addresses), 'Production host still resolves externally: '+host
                proof[host][name]=addresses
        pathlib.Path('build/release-evidence/production-host-isolation.json').write_text(json.dumps({'scope':'production hosts only; not full offline','addresses':proof},indent=2))
        with open(os.environ['GITHUB_ENV'],'a') as output:
            output.write('TUTAM_QA_HOSTS_ISOLATED=1\n')
        PY
    - name: Select and boot an available iPhone simulator
      run: |
        set -euo pipefail
        test "$TUTAM_QA_HOSTS_ISOLATED" = 1
        xcrun simctl list devices available --json > build/release-evidence/simulator-devices.json
        simulator_id=$(python3 - <<'PY'
        import json
        data=json.load(open('build/release-evidence/simulator-devices.json'))
        for runtime, devices in sorted(data['devices'].items(), reverse=True):
            if '.iOS-' not in runtime:
                continue
            version=runtime.rsplit('.iOS-',1)[1].split('-')
            if int(version[0]) < 17:
                continue
            for device in devices:
                if device.get('isAvailable') and device['name'].startswith('iPhone'):
                    print(device['udid'])
                    raise SystemExit(0)
        raise SystemExit('No available iPhone simulator with iOS 17 or newer')
        PY
        )
        echo "TUTAM_QA_SIMULATOR=$simulator_id" >> "$GITHUB_ENV"
        if ! xcrun simctl list devices booted | grep -Fq "$simulator_id"; then
          xcrun simctl boot "$simulator_id"
        fi
        xcrun simctl bootstatus "$simulator_id" -b
    - name: Add guest editor diagnostics while retaining all assertions
      run: |
        python3 - <<'PY'
        import pathlib
        path=pathlib.Path('ios/App/AppUITests/NativeGuestSmokeTests.swift')
        source=path.read_text()
        needle='        XCTAssertNotNil((editor.value as? String)?.range(of: "GIOI", options: [.caseInsensitive, .diacriticInsensitive]),'
        assert source.count(needle) == 1
        diagnostic='        print("QA_COPY_EDITOR_VALUE: \(String(describing: editor.value))")\n        print("QA_COPY_EDITOR_AX: \(editor.debugDescription)")\n        evidence("copy-editor-after-native-typing", app: app)\n'
        normalized=needle.replace('?.range', '?.replacingOccurrences(of: "\\n", with: "").range')
        path.write_text(source.replace(needle, diagnostic+normalized))
        PY
