name: iOS 18.5 copying and rosary regression
'on':
  push:
    branches:
    - codex/ios-qa-20261119-1gh4bo0
permissions:
  contents: read
jobs:
  simulator:
    name: ${{ matrix.check }} on iOS 18.5
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: Copying
            test: NativeExtendedGuestTests/testNativeScriptureCopyingReferenceAndGhost
          - check: Rosary Back and rotation
            test: NativeGuestSmokeTests/testRosaryBackPreservesCountInPortraitAndLandscape
          - check: Rosary manual and automatic audio
            test: NativeSimulatorSnapshotTests/testRosaryManualAndAutomaticAudioProgress
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
        repository: quangtuansitoanthu-boop/r-8f31b6c2
        ref: 5ce555524363ce13a730ca6a9ef78fff897c1b3f
    - uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: npm
    - name: Verify Apple toolchain
      run: |
        xcodebuild -version
        pod --version
    - name: Install locked dependencies
      run: npm ci
    - name: Build and verify the exact release candidate bundle
      env:
        TUTAM_BUNDLE_SYNCED: '1'
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "5ce555524363ce13a730ca6a9ef78fff897c1b3f"
        export VITE_GOOGLE_IOS_CLIENT_ID="$(python3 - <<'PY'
        import plistlib
        with open('ios/App/App/Info.plist', 'rb') as info:
            plist = plistlib.load(info)
        google = next(value for row in plist['CFBundleURLTypes'] if row.get('CFBundleURLName') == 'GoogleSignIn' for value in row['CFBundleURLSchemes'])
        assert google.startswith('com.googleusercontent.apps.')
        print(google.removeprefix('com.googleusercontent.apps.') + '.apps.googleusercontent.com')
        PY
        )"
        npm run build:mobile -- --platform ios
        echo 'f50dae2dfbe24ba8bad4185ac95c3649c7319437b468ddeeb30d162cb4dde255  ios/App/App/public/covers/niem-phat-thap-yeu-phap-thoai.webp' | shasum -a 256 -c
        node --input-type=module - <<'JS'
        import fs from 'node:fs';
        import assert from 'node:assert/strict';
        const rows = JSON.parse(fs.readFileSync('ios/App/App/public/offline-data/talks.json'));
        const album = rows.find(row => row.id === 'pt_1781800562343');
        assert.equal(album.anh_dai_dien, 'covers/niem-phat-thap-yeu-phap-thoai.webp#pos=53%25%2014%25');
        assert.equal(album.tracks.length, 23);
        JS
    - name: Isolate production hosts before native simulator UI tests
      run: |
        set -euo pipefail
        mkdir -p build/release-evidence
        python3 - <<'PY'
        import json, os, pathlib, re, subprocess
        proxy=subprocess.check_output(['scutil','--proxy'],text=True)
        assert not re.search(r'(?:HTTPEnable|HTTPSEnable|SOCKSEnable|ProxyAutoConfigEnable|ProxyAutoDiscoveryEnable)\s*:\s*1\b',proxy), 'Proxy-enabled runner cannot prove production host isolation'
        assert not any(value for key,value in os.environ.items() if key.lower() in ('http_proxy','https_proxy','all_proxy')), 'Proxy environment must be disabled for native UI isolation'
        hosts={'quangtu.vn','www.quangtu.vn','media.quangtu.vn','quangtu-web.quangtu-ansitoanthu.workers.dev','quangtu.vercel.app'}
        assert {'quangtu.vn','quangtu-web.quangtu-ansitoanthu.workers.dev','quangtu.vercel.app'}.issubset(hosts), 'Expected native origins and legacy alias are missing'
        assert all(re.fullmatch(r'[a-z0-9.-]+',host) for host in hosts)
        backup=pathlib.Path(os.environ['RUNNER_TEMP'])/'tutam-native-qa-hosts.backup'
        assert not backup.exists(), 'Refusing to replace a previous hosts backup'
        original=pathlib.Path('/etc/hosts').read_bytes()
        backup.write_bytes(original)
        lines=[]
        for line in original.decode().splitlines():
            address,separator,comment=line.partition('#')
            parts=address.split()
            if len(parts)>1 and any(host.lower() in hosts for host in parts[1:]):
                aliases=[host for host in parts[1:] if host.lower() not in hosts]
                if aliases:
                    lines.append(parts[0]+'\t'+' '.join(aliases)+((' #'+comment) if separator else ''))
                elif separator:
                    lines.append('#'+comment)
            else:
                lines.append(line)
        lines.append('# Tu Tap native CI: production-host isolation, not full offline mode')
        for host in sorted(hosts):
            lines.extend(['127.0.0.1\t'+host,'::1\t'+host])
        subprocess.run(['sudo','tee','/etc/hosts'],input='\n'.join(lines)+'\n',text=True,check=True,stdout=subprocess.DEVNULL)
        pathlib.Path('build/release-evidence/production-hosts.json').write_text(json.dumps(sorted(hosts),indent=2))
        PY
        sudo dscacheutil -flushcache
        python3 - <<'PY'
        import ipaddress, json, os, pathlib, socket
        hosts=json.loads(pathlib.Path('build/release-evidence/production-hosts.json').read_text())
        proof={}
        for host in hosts:
            proof[host]={}
            for family,name in [(socket.AF_INET,'ipv4'),(socket.AF_INET6,'ipv6')]:
                addresses=sorted({entry[4][0] for entry in socket.getaddrinfo(host,443,family,socket.SOCK_STREAM)})
                assert addresses and all(ipaddress.ip_address(address).is_loopback for address in addresses), 'Production host still resolves externally: '+host
                proof[host][name]=addresses
        pathlib.Path('build/release-evidence/production-host-isolation.json').write_text(json.dumps({'scope':'production hosts only; not full offline','addresses':proof},indent=2))
        with open(os.environ['GITHUB_ENV'],'a') as output:
            output.write('TUTAM_QA_HOSTS_ISOLATED=1\n')
        PY
    - name: Select and boot an available iPhone Simulator on iOS 18.5
      timeout-minutes: 8
      run: |
        set -euo pipefail
        test "$TUTAM_QA_HOSTS_ISOLATED" = 1
        xcrun simctl list devices available --json > build/release-evidence/simulator-devices.json
        simulator_id=$(python3 - <<'PY'
        import json
        data=json.load(open('build/release-evidence/simulator-devices.json'))
        for runtime, devices in sorted(data['devices'].items(), reverse=True):
            if '.iOS-' not in runtime:
                continue
            version=runtime.rsplit('.iOS-',1)[1].split('-')
            if version[:2] != ['18','5']:
                continue
            for device in devices:
                if device.get('isAvailable') and device['name'] == 'iPhone 16 Pro':
                    print(device['udid'])
                    raise SystemExit(0)
        raise SystemExit('No available iPhone simulator with iOS 26.2')
        PY
        )
        echo "TUTAM_QA_SIMULATOR=$simulator_id" >> "$GITHUB_ENV"
        if ! xcrun simctl list devices booted | grep -Fq "$simulator_id"; then
          xcrun simctl boot "$simulator_id"
        fi
        xcrun simctl bootstatus "$simulator_id" -b
    - name: Trace copying geometry and omit blocking in-test screenshots
      run: |
        python3 - <<'PY'
        from pathlib import Path
        from textwrap import indent
        fixture=Path('ios/App/AppUITests/NativeGuestSmokeTests.swift')
        src=fixture.read_text()
        start=src.index('        // Lấy snapshot AX trước')
        end=src.index('\n    }', start)
        src=src[:start] + '        print("QA evidence checkpoint: \\(name)")' + src[end:]
        start=src.index('        waitUntil("The editor must accept the text and the reference must scroll')
        end=src.index('        XCTAssertTrue(app.keyboards.firstMatch.exists)',start)
        src=src[:start]+r'''        let scrollDeadline = Date().addingTimeInterval(25)
        var referenceBounds = CGRect.zero
        var wordBounds = CGRect.zero
        var wordIsVisible = false
        repeat {
            if reference.exists && laterWord.exists {
                referenceBounds = reference.frame
                wordBounds = laterWord.frame
                wordIsVisible = !wordBounds.isEmpty && referenceBounds.intersects(wordBounds) &&
                    wordBounds.minY >= referenceBounds.minY - 1 && wordBounds.maxY <= referenceBounds.maxY + 1
            }
            if wordIsVisible { break }
            RunLoop.current.run(until: Date().addingTimeInterval(0.25))
        } while Date() < scrollDeadline
        XCTAssertTrue(wordIsVisible, "The reference must scroll the later word into view. Reference: \(referenceBounds), word: \(wordBounds)")
        XCTAssertNotNil((editor.value as? String)?.replacingOccurrences(of: "\n", with: "").range(of: "GIOI", options: [.caseInsensitive, .diacriticInsensitive]),
                        "The editor must accept the typed text")
        '''+src[end:]
        fixture.write_text(src)
        bridge=Path('ios/App/App/TuTapBridgeViewController.swift')
        src=bridge.read_text()
        anchor="          let previousPath = location.pathname;"
        assert src.count(anchor) == 1
        diagnostic=r"""
          let copyTimer, recentScroll = null;
          const copyScroll = Element.prototype.scrollTo;
          Element.prototype.scrollTo = function (...args) {
            if (this.id === 'copy-source-text') recentScroll = args[0]?.top ?? null;
            return copyScroll.apply(this, args);
          };
          const emitCopy = () => {
            clearTimeout(copyTimer);
            copyTimer = setTimeout(() => {
              const panel = document.querySelector('#copy-source-text');
              const editor = document.querySelector('#copy-text');
              const current = panel?.querySelector('.source-word--current');
              if (!panel || !editor || !current) return;
              const word = [...panel.querySelectorAll('[data-copy-word]')].find(it => it.textContent.trim() === 'GIỚI');
              const range = getSelection()?.rangeCount ? getSelection().getRangeAt(0) : null;
              const prefix = range && editor.contains(range.endContainer) ? range.cloneRange() : null;
              if (prefix) prefix.setStart(editor, 0);
              log({ type: 'copy-geometry', textLength: editor.textContent.length, caretLength: prefix?.toString().length ?? null,
                    caretFocused: document.activeElement === editor, targetWord: current.textContent.trim(),
                    scrollTop: panel.scrollTop, attemptedTop: recentScroll, viewport: numericRect(panel.getBoundingClientRect()),
                    target: numericRect(current.getBoundingClientRect()), later: word ? numericRect(word.getBoundingClientRect()) : null });
            }, 450);
          };
          for (const type of ['input','beforeinput','keyup','compositionend']) {
            document.addEventListener(type, event => { if (event.target.closest?.('#copy-text')) emitCopy(); }, { capture: true, passive: true });
          }
        """
        bridge.write_text(src.replace(anchor, indent(diagnostic, "        ") + anchor))
        PY
    - name: Build iOS app, native plugins and UI tests once for the selected simulator
      id: simulator_build
      run: |
        set -euo pipefail
        test "$TUTAM_QA_HOSTS_ISOLATED" = 1
        xcodebuild -quiet \
          -workspace ios/App/App.xcworkspace -scheme App -configuration Debug \
          -sdk iphonesimulator -destination "platform=iOS Simulator,id=$TUTAM_QA_SIMULATOR" \
          -derivedDataPath build/ios-simulator \
          -only-testing:AppUITests \
          CODE_SIGNING_ALLOWED=NO build-for-testing
    - name: Verify packaged Google privacy manifests
      run: |
        app='build/ios-simulator/Build/Products/Debug-iphonesimulator/App.app'
        for bundle in GoogleSignIn.bundle GTMAppAuth_Privacy.bundle GTMSessionFetcher_Core_Privacy.bundle AppAuthCore_Privacy.bundle; do
          manifest="$(find "$app" -path "*/$bundle/PrivacyInfo.xcprivacy" -print -quit)"
          test -n "$manifest" || { echo "::error::Missing privacy manifest for $bundle"; exit 1; }
        done
        while IFS= read -r manifest; do
          plutil -lint "$manifest"
        done < <(find "$app" -name PrivacyInfo.xcprivacy -print)
        find "$app" -name PrivacyInfo.xcprivacy -print | sed "s|$app/||" > build/release-evidence/privacy-manifests.txt
        grep -q 'GoogleSignIn (7.1.0)' ios/App/Podfile.lock
        cp ios/App/Podfile.lock build/release-evidence/Podfile.lock
    - name: Run the selected iOS 18.5 test
      timeout-minutes: 21
      env:
        QA_METHOD: ${{ matrix.test }}
      run: |
        set -euo pipefail
        test "$TUTAM_QA_HOSTS_ISOLATED" = 1
        xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug \
          -sdk iphonesimulator -destination "platform=iOS Simulator,id=$TUTAM_QA_SIMULATOR" \
          -derivedDataPath build/ios-simulator -resultBundlePath build/release-evidence/NativeGuestSmoke.xcresult \
          -only-testing:"AppUITests/$QA_METHOD" \
          -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 990 \
          -maximum-test-execution-time-allowance 990 CODE_SIGNING_ALLOWED=NO test-without-building \
          2>&1 | tee build/release-evidence/native-ui-test.log
    - name: Require the method to pass with no skips
      run: |
        set -euo pipefail
        xcrun xcresulttool get test-results summary --path build/release-evidence/NativeGuestSmoke.xcresult > build/release-evidence/native-ui-summary.json
        python3 - <<'PY'
        import json
        data=json.load(open('build/release-evidence/native-ui-summary.json'))
        assert data['passedTests'] == 1 and data['failedTests'] == 0 and data['skippedTests'] == 0, data
        print('Verified native UI test execution: 1 passed, 0 failed, 0 skipped')
        PY
    - name: Collect WebView copying viewport and screenshot
      if: always()
      timeout-minutes: 2
      run: |
        set -euo pipefail
        container=$(xcrun simctl get_app_container "$TUTAM_QA_SIMULATOR" vn.quangtu.tutam data)
        eventfile="$container/Library/Caches/tutam-qa-events.jsonl"
        if [ -f "$eventfile" ]; then
          grep '"type":"copy-geometry"' "$eventfile" | tail -30 | tee build/release-evidence/copy-geometry.jsonl || true
        fi
        xcrun simctl io "$TUTAM_QA_SIMULATOR" screenshot build/release-evidence/simulator.png || true
    - name: Shut down the CI simulator before restoring network resolution
      if: always()
      timeout-minutes: 2
      run: |
        set -euo pipefail
        if [ -n "${TUTAM_QA_SIMULATOR:-}" ]; then
          xcrun simctl shutdown "$TUTAM_QA_SIMULATOR"
        fi
    - name: Restore ephemeral runner hosts
      if: always()
      run: |
        set -euo pipefail
        backup="$RUNNER_TEMP/tutam-native-qa-hosts.backup"
        if [ -f "$backup" ]; then
          sudo cp "$backup" /etc/hosts
          sudo dscacheutil -flushcache
          cmp "$backup" /etc/hosts
        fi
    - name: Record simulator test summary
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: ios185-${{ strategy.job-index }}
        path: |-
          build/release-evidence/native-ui-summary.json
          build/release-evidence/native-ui-test.log
          build/release-evidence/copy-geometry.jsonl
          build/release-evidence/simulator.png
          build/release-evidence/NativeGuestSmoke.xcresult
        if-no-files-found: warn
        retention-days: 3
