            products_artifact_digest: 59656289d6877cf544501db41b5884bd129a78f2745fffc24a78c1cd6ed1ddbf
            products_artifact_bytes: 149209320
            products_metadata_sha256: 4b1264b5f585f44865382b981a10be9a279ca225f31a70f24640a627207d3e36
            products_archive_sha256: 7e52fc74b114d267dc064304da164a89be96a364f461b811870191e581e4cee7
            products_build_job_id: "136891184603"
          - ios: "27.0"
            runner: xcode-27
            xcode: /Applications/Xcode_27.1.app/Contents/Developer
            group: snapshot
            products_artifact_id: "14713610297"
            products_artifact_digest: fbfb332c920c5efd001dda3500ef257bf38d1178c5484466037d558fd1f5a067
            products_artifact_bytes: 144026599
            products_metadata_sha256: 5d9932ca092302bd119e23d62364240a18c2b6733a052302afd5bb26722244d6
            products_archive_sha256: c0cc14b536aaed67912d148e3c9cf3c8abeed1eaa7358727c53ac205ac570d96
            products_build_job_id: "136891184871"
    env:
      DEVELOPER_DIR: ${{ matrix.xcode }}
      IOS_RUNTIME: ${{ matrix.ios }}
      TUTAM_QA_COPY_LIFECYCLE_LOGS: ${{ matrix.ios == '27.0' && matrix.group == 'extended' && '1' || '0' }}
      TUTAM_QA_NOTIFICATION_LOGS: ${{ matrix.ios == '27.0' && matrix.group == 'personal' && '1' || '0' }}
      PRODUCTS_ARTIFACT_ID: ${{ matrix.products_artifact_id }}
      PRODUCTS_ARTIFACT_DIGEST: ${{ matrix.products_artifact_digest }}
      PRODUCTS_ARTIFACT_BYTES: ${{ matrix.products_artifact_bytes }}
      PRODUCTS_METADATA_SHA256: ${{ matrix.products_metadata_sha256 }}
      PRODUCTS_ARCHIVE_SHA256: ${{ matrix.products_archive_sha256 }}
      PRODUCTS_BUILD_JOB_ID: ${{ matrix.products_build_job_id }}
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: quangtuansitoanthu-boop/r-8f31b6c2
          ref: 166d0aeb43341da6f907e096f80a003b49d3be89
          path: app
          persist-credentials: false
      - name: Verify and apply exact current source
        run: |-
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,os,pathlib,re,subprocess
          h=pathlib.Path('../harness')
          pins={'BASE_SOURCE_MANIFEST_SHA256':'mobile-current-manifest.json','UI_FIXES_MANIFEST_SHA256':'ui-fixes.json','CURRENT_FOLLOW_UP_MANIFEST_SHA256':'current-follow-up.json','QA_TEST_FOLLOW_UP_MANIFEST_SHA256':'qa-test-follow-up.json','LATE_OVERLAY_MANIFEST_SHA256':'late-overlay.json','CURRENT_SOURCE_OVERLAY_MANIFEST_SHA256':'moderation-brand-overlay.json','CURRENT_SOURCE_OVERLAY_HELPER_SHA256':'apply-moderation-brand.py','IOS_CASE_RUNNER_SHA256':'run-ios-cases.py','TUTAM_RUNTIME_MANIFEST_SHA256':'runtime-data-manifest.json','RUNTIME_DATA_HELPER_SHA256':'apply-runtime-data.py','IOS_ISOLATION_HELPER_SHA256':'ios-isolate.py','TUTAM_TEST_SUPPORT_MANIFEST_SHA256':'test-support-manifest.json','TEST_SUPPORT_HELPER_SHA256':'apply-test-support.py'}
          for variable,name in pins.items():
              expected=os.environ[variable]
              assert re.fullmatch(r'[0-9a-f]{64}',expected),'Unfilled final publication pin: '+variable
              assert hashlib.sha256((h/name).read_bytes()).hexdigest()==expected,name
          assert re.fullmatch(r'[0-9a-f]{64}',os.environ['CURRENT_SOURCE_EXPECTED_MAP_SHA256'])
          expected_count=int(os.environ['CURRENT_SOURCE_EXPECTED_FILE_COUNT'])
          added_count=int(os.environ['CURRENT_SOURCE_ADDED_FILE_COUNT'])
          assert expected_count==3275+added_count and added_count>0
          assert int(os.environ['CURRENT_SOURCE_OVERLAY_FILE_COUNT'])>0
          assert subprocess.check_output(['git','--no-optional-locks','-C',str(h),'rev-parse','HEAD'],text=True).strip()==os.environ['GITHUB_SHA']
          PY
          python3 ../harness/apply-current.py .
          python3 ../harness/apply-ui-fixes.py .
          python3 ../harness/apply-current-follow-up.py .
          python3 ../harness/apply-qa-test-follow-up.py .
          python3 ../harness/apply-late-overlay.py .
          python3 ../harness/apply-moderation-brand.py .
          python3 ../harness/apply-runtime-data.py .
          python3 ../harness/apply-test-support.py .
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,runpy
          h=pathlib.Path('../harness');q=pathlib.Path('qa-evidence')
          expected_count=int(os.environ['CURRENT_SOURCE_EXPECTED_FILE_COUNT']);added_count=int(os.environ['CURRENT_SOURCE_ADDED_FILE_COUNT'])
          sha=lambda path:hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
          blob=lambda data:hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          manifest=json.loads((h/'moderation-brand-overlay.json').read_bytes())
          report=json.loads((q/'moderation-brand-source-verification.json').read_bytes())
          expected=json.loads((q/'moderation-brand-expected.json').read_bytes())
          assert manifest['phase']=='final' and manifest['readyForPublication'] is True
          assert report['status']=='EXACT_MODERATION_BRAND_SOURCE_VERIFIED' and report['phase']=='final'
          assert report['manifestSha256']==os.environ['CURRENT_SOURCE_OVERLAY_MANIFEST_SHA256']
          assert report['fileCount']==manifest['fileCount']==int(os.environ['CURRENT_SOURCE_OVERLAY_FILE_COUNT'])
          assert report['currentExpectedFileCount']==manifest['currentExpectedFileCount']==len(expected)==expected_count
          assert report['addedFileCount']==manifest['addedFileCount']==added_count
          assert report['currentExpectedMapSha256']==manifest['currentExpectedMapSha256']==os.environ['CURRENT_SOURCE_EXPECTED_MAP_SHA256']==sha(q/'moderation-brand-expected.json')
          assert report['files']==manifest['files'] and report['nativeFixtureOwnership']==manifest['nativeFixtureOwnership']
          layers=[];runtime_paths=set()
          for name,variable,proof_name,status in [
           ('ui-fixes.json','UI_FIXES_MANIFEST_SHA256','ui-fixes-verification.json','EXACT_UI_FIXES_VERIFIED'),
           ('current-follow-up.json','CURRENT_FOLLOW_UP_MANIFEST_SHA256','current-follow-up-verification.json','EXACT_CURRENT_FOLLOW_UP_VERIFIED'),
           ('qa-test-follow-up.json','QA_TEST_FOLLOW_UP_MANIFEST_SHA256','qa-test-follow-up-verification.json','EXACT_QA_TEST_FOLLOW_UP_VERIFIED'),
           ('late-overlay.json','LATE_OVERLAY_MANIFEST_SHA256','late-overlay-verification.json','EXACT_LATE_OVERLAY_VERIFIED'),
           ('moderation-brand-overlay.json','CURRENT_SOURCE_OVERLAY_MANIFEST_SHA256','moderation-brand-source-verification.json','EXACT_MODERATION_BRAND_SOURCE_VERIFIED')]:
              layer=json.loads((h/name).read_bytes());proof=json.loads((q/proof_name).read_bytes())
              assert proof['status']==status and proof['manifestSha256']==os.environ[variable]
              assert proof.get('mode','all')=='all'
              assert proof['fileCount']==layer['fileCount']
              if 'archiveSha256' in proof:assert proof['archiveSha256']==layer['archiveSha256']
              runtime_paths.update(layer.get('runtimePaths',[]))
              layers.append({'manifest':name,'manifestSha256':os.environ[variable],'archiveSha256':layer['archiveSha256'],'fileCount':layer['fileCount']})
          runtime_files=[]
          for name in sorted(runtime_paths):
              data=pathlib.Path(name).read_bytes()
              assert blob(data)==expected[name],name
              runtime_files.append({'path':name,'sha256':hashlib.sha256(data).hexdigest(),'gitBlobSha1':blob(data),'bytes':len(data)})
          native_paths={item['path'] for item in manifest['files'] if item['classification']=='native-test'}
          assert native_paths=={'ios/App/AppUITests/NativeGuestSmokeTests.swift','android/app/src/androidTest/java/vn/quangtu/tutam/audio/DharmaAudioWidgetInitialLayoutTest.java','android/app/src/androidTest/java/vn/quangtu/tutam/widgets/CalendarWidgetRenderingTest.java'}
          native_files=[item for item in manifest['files'] if item['path'] in native_paths]
          assert all(sha(item['path'])==item['sha256'] for item in native_files)
          swift=pathlib.Path('ios/App/AppUITests/NativeGuestSmokeTests.swift')
          assert sha(swift)==os.environ['IOS_HARNESS_SHA256']
          module=runpy.run_path(str(h/'run-ios-cases.py'));groups=module['GROUPS']
          assert {key:len(value) for key,value in groups.items()}=={'smoke':4,'extended':5,'personal':2,'snapshot':2}
          identifiers=[value for values in groups.values() for value in values]
          actual=[];owner=None
          for line in swift.read_text().splitlines():
              kind=re.search(r'^(?:final )?class (\w+)',line)
              if kind:owner=kind.group(1)
              method=re.search(r'^    func (test\w+)\(',line)
              if method:actual.append(owner+'/'+method.group(1))
          assert len(actual)==len(identifiers)==len(set(identifiers))==13 and set(actual)==set(identifiers)
          assert 'copy-before-native-url-open' in swift.read_text() and 'copy-after-native-url-open' in swift.read_text()
          runtime=json.loads((q/'runtime-data-verification.json').read_bytes())
          assert runtime['status']=='EXACT_RUNTIME_DATA_VERIFIED' and runtime['fileCount']==7
          assert runtime['manifestSha256']==os.environ['TUTAM_RUNTIME_MANIFEST_SHA256']
          assert all(sha(item['path'])==item['sha256'] for item in runtime['files'])
          support=json.loads((q/'test-support-verification.json').read_bytes())
          assert support['status']=='EXACT_TEST_SUPPORT_VERIFIED' and support['fileCount']==2 and support['executedConfiguration'] is False
          assert support['manifestSha256']==os.environ['TUTAM_TEST_SUPPORT_MANIFEST_SHA256']
          assert all(sha(item['path'])==item['sha256'] for item in support['files'])
          proof={'schemaVersion':2,'baseSourceManifestSha256':os.environ['BASE_SOURCE_MANIFEST_SHA256'],
           'currentSourceOverlayManifestSha256':os.environ['CURRENT_SOURCE_OVERLAY_MANIFEST_SHA256'],
           'currentSourceOverlayArchiveSha256':manifest['archiveSha256'],'currentSourceOverlayFileCount':manifest['fileCount'],
           'currentSourceExpectedMapSha256':report['currentExpectedMapSha256'],'currentSourceExpectedFileCount':expected_count,'currentSourceAddedFileCount':added_count,
           'currentSourceRuntimeFiles':runtime_files,'sourceLayers':layers,'nativeFixtureOwnership':manifest['nativeFixtureOwnership'],
           'nativeFixtureFiles':native_files,'harnessSha256':sha(swift),'testMethodCount':13,'testIdentifiers':identifiers,
           'caseRunnerSha256':sha(h/'run-ios-cases.py'),'runtimeDataManifestSha256':runtime['manifestSha256'],
           'runtimeDataArchiveSha256':runtime['archiveSha256'],'runtimeDataFiles':runtime['files'],
           'testSupportManifestSha256':support['manifestSha256'],'testSupportFiles':support['files'],
           'simulatorReadinessPolicy':{'command':'xcrun simctl listapps','timeoutSeconds':120,'stage':'pre-test infrastructure only','nativeAssertionsChanged':False,'perCaseWatchdogSeconds':750}}
          (q/'source-overlays-proof.json').write_text(json.dumps(proof,indent=2)+'\n')
          PY
      - name: Restore verified source proof for this test job
        run: |-
          set -euo pipefail
          mkdir -p build/release-evidence
          cp qa-evidence/*verification.json build/release-evidence/
          cp qa-evidence/source-overlays-proof.json build/release-evidence/
      - name: Verify immutable producer builds and selected Products through read-only API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          python3 - <<'PY'
          import json,os,pathlib,urllib.request
          repo=os.environ['GITHUB_REPOSITORY'];run=os.environ['PRODUCTS_SOURCE_RUN_ID'];attempt=os.environ['PRODUCTS_SOURCE_RUN_ATTEMPT']
          assert repo=='quangtuansitoanthu-boop/simulator-checks'
          def get(path):
              request=urllib.request.Request('https://api.github.com/repos/'+repo+path,
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request,timeout=45) as response:return json.load(response)
          source=get('/actions/runs/'+run)
          assert str(source['id'])==run and str(source['run_attempt'])==attempt and source['status']=='completed'
          assert source['head_sha']==os.environ['PRODUCTS_SOURCE_HEAD_SHA'] and source['head_branch']=='codex/full-mobile-audit-20261121'
          assert source['path']=='.github/workflows/moderation-ios.yml'
          jobs=get('/actions/runs/'+run+'/attempts/'+attempt+'/jobs?per_page=100')['jobs'];selected=[]
          for job_id,ios in [('136891184603','18.5'),('136891184871','27.0')]:
              matches=[job for job in jobs if str(job['id'])==job_id];assert len(matches)==1
              job=matches[0]
              assert job['name']=='Build reviewed iOS '+ios+' products once' and job['status']=='completed' and job['conclusion']=='success'
              selected.append({key:job[key] for key in ('id','name','status','conclusion')})
          artifact=get('/actions/artifacts/'+os.environ['PRODUCTS_ARTIFACT_ID'])
          assert str(artifact['id'])==os.environ['PRODUCTS_ARTIFACT_ID'] and artifact['expired'] is False
          assert artifact['name']=='ios-moderation-products-'+os.environ['IOS_RUNTIME']+'-'+run+'-'+attempt
          assert artifact['digest']=='sha256:'+os.environ['PRODUCTS_ARTIFACT_DIGEST'] and artifact['size_in_bytes']==int(os.environ['PRODUCTS_ARTIFACT_BYTES'])
          assert str(artifact['workflow_run']['id'])==run and artifact['workflow_run']['head_sha']==source['head_sha']
          assert artifact['workflow_run']['repository_id']==artifact['workflow_run']['head_repository_id']==1462236859
          receipt={'sourceRunId':run,'sourceRunAttempt':attempt,'sourceHeadSha':source['head_sha'],
           'sourceRunStatus':source['status'],'sourceRunConclusion':source['conclusion'],'sourceBuildJobs':selected,
           'artifact':{key:artifact[key] for key in ('id','name','digest','expired','size_in_bytes')},
           'currentTestRunId':os.environ['GITHUB_RUN_ID'],'currentTestRunAttempt':os.environ['GITHUB_RUN_ATTEMPT'],
           'scope':'reuse successful compiled Products; producer native tests did not run because archive metadata validation failed'}
          pathlib.Path('build/release-evidence/prebuilt-source-verification.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print('Verified both producer build jobs succeeded; selected immutable Products API ID, digest, source commit and attempt match')
          PY
      - name: Download matching app runner and xctestrun
        uses: actions/download-artifact@v6
        with:
          name: ios-moderation-products-${{ matrix.ios }}-44919158999-1
          run-id: 44919158999
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ios-prebuilt
      - name: Verify matching Products and restore full tree
        run: |-
          set -euo pipefail
          cmp ../harness/moderation-brand-overlay.json ../ios-prebuilt/current-source-overlay-manifest.json
          cmp ../harness/runtime-data-manifest.json ../ios-prebuilt/runtime-data-manifest.json
          cmp qa-evidence/moderation-brand-expected.json ../ios-prebuilt/current-source-expected.json
          cmp build/release-evidence/source-overlays-proof.json ../ios-prebuilt/source-overlays-proof.json
          python3 - <<'PY'
          import hashlib,json,os,pathlib,plistlib,tarfile
          root=pathlib.Path('../ios-prebuilt');sha=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          assert sha(root/'products-metadata.json')==os.environ['PRODUCTS_METADATA_SHA256']
          metadata=json.loads((root/'products-metadata.json').read_bytes());proof=json.loads((root/'source-overlays-proof.json').read_bytes())
          assert metadata['schemaVersion']==2 and all(metadata[key]==value for key,value in proof.items())
          assert metadata['currentSourceOverlayManifestSha256']==os.environ['CURRENT_SOURCE_OVERLAY_MANIFEST_SHA256']
          assert metadata['currentSourceExpectedMapSha256']==os.environ['CURRENT_SOURCE_EXPECTED_MAP_SHA256']==sha(root/'current-source-expected.json')
          assert metadata['harnessSha256']==os.environ['IOS_HARNESS_SHA256'] and metadata['caseRunnerSha256']==os.environ['IOS_CASE_RUNNER_SHA256']
          assert metadata['ios']==os.environ['IOS_RUNTIME']
          assert metadata['workflowRunId']==os.environ['PRODUCTS_SOURCE_RUN_ID'] and metadata['workflowRunAttempt']==os.environ['PRODUCTS_SOURCE_RUN_ATTEMPT']
          assert metadata['harnessRepositoryCommit']==os.environ['PRODUCTS_SOURCE_HEAD_SHA']
          assert metadata['sourceOverlaysProofSha256']==sha(root/'source-overlays-proof.json')==os.environ['PRODUCTS_SOURCE_PROOF_SHA256']
          assert metadata['archiveSha256']==sha(root/'UITestProducts.tar.gz')==os.environ['PRODUCTS_ARCHIVE_SHA256']
          config=json.loads((root/'ios-info-build-config.json').read_bytes());expected_info=plistlib.loads((root/'ios-info.expected.plist').read_bytes())
          assert metadata['generatedIosInfo']==config and metadata['generatedIosInfoProofSha256']==sha(root/'ios-info-build-config.json')==os.environ['PRODUCTS_GENERATED_INFO_PROOF_SHA256']
          assert config['schemaVersion']==1 and config['path']=='ios/App/App/Info.plist' and config['transform']=='configureIosGoogle'
          assert config['publicQaClientId']==os.environ['IOS_QA_GOOGLE_CLIENT_ID'] and config['verifiedExactBytes'] is True
          info_entry=next(item for item in proof['currentSourceRuntimeFiles'] if item['path']==config['path'])
          assert sha(config['path'])==sha(root/'ios-info.original.plist')==config['sourceSha256']==info_entry['sha256']
          assert pathlib.Path(config['path']).read_bytes()==(root/'ios-info.original.plist').read_bytes()
          assert sha(root/'ios-info.expected.plist')==config['expectedSha256']==config['actualSha256']
          assert config['sourceHelperPath']=='scripts/lib/ios-google-config.mjs' and sha(config['sourceHelperPath'])==config['sourceHelperSha256']
          helper_data=pathlib.Path(config['sourceHelperPath']).read_bytes()
          helper_blob=hashlib.sha1(b'blob '+str(len(helper_data)).encode()+b'\0'+helper_data).hexdigest()
          assert helper_blob==config['sourceHelperGitBlobSha1']==json.loads((root/'current-source-expected.json').read_bytes())[config['sourceHelperPath']]
          assert config['productIdentity']=={'bundleId':'vn.quangtu.tutam','bundleName':'App','displayName':expected_info['CFBundleDisplayName'],'urlTypes':expected_info['CFBundleURLTypes']}
          for filename in ('ios-info.original.plist','ios-info.expected.plist','ios-info-build-config.json'):
              pathlib.Path('build/release-evidence',filename).write_bytes((root/filename).read_bytes())
          skipped_metadata=[]
          with tarfile.open(root/'UITestProducts.tar.gz','r:gz') as archive:
              for member in archive:
                  if member.name=='._Products':
                      assert not skipped_metadata and member.isfile() and member.size==172,'Unexpected root metadata type, size or duplicate'
                      payload=archive.extractfile(member).read()
                      assert len(payload)==172 and payload[:8]==bytes.fromhex('0005160700020000')
                      assert hashlib.sha256(payload).hexdigest()==os.environ['ROOT_APPLEDOUBLE_SHA256']
                      skipped_metadata.append({'name':member.name,'bytes':172,'sha256':hashlib.sha256(payload).hexdigest(),'magic':'0005160700020000'})
                      continue
                  path=pathlib.PurePosixPath(member.name)
                  assert not path.is_absolute() and '..' not in path.parts and path.parts[0]=='Products'
                  assert not member.isdev() and not member.isfifo()
                  if member.issym() or member.islnk():
                      link=pathlib.PurePosixPath(member.linkname)
                      assert not link.is_absolute() and '..' not in link.parts
          receipt={'sourceRunId':metadata['workflowRunId'],'sourceRunAttempt':metadata['workflowRunAttempt'],
           'sourceHeadSha':metadata['harnessRepositoryCommit'],'ios':metadata['ios'],'buildJobId':os.environ['PRODUCTS_BUILD_JOB_ID'],
           'artifactId':os.environ['PRODUCTS_ARTIFACT_ID'],'artifactDigest':os.environ['PRODUCTS_ARTIFACT_DIGEST'],
           'artifactBytes':int(os.environ['PRODUCTS_ARTIFACT_BYTES']),'metadataSha256':sha(root/'products-metadata.json'),
           'archiveSha256':metadata['archiveSha256'],'sourceOverlaysProofSha256':metadata['sourceOverlaysProofSha256'],
           'generatedIosInfoProofSha256':metadata['generatedIosInfoProofSha256'],'skippedRootMetadata':skipped_metadata,
           'extractionPolicy':'Products subtree only; verified root AppleDouble is never extracted',
           'currentTestRunId':os.environ['GITHUB_RUN_ID'],'currentTestRunAttempt':os.environ['GITHUB_RUN_ATTEMPT']}
          pathlib.Path('build/release-evidence/prebuilt-products-verification.json').write_text(json.dumps(receipt,indent=2)+'\n')
          pathlib.Path('build/release-evidence/products-metadata.json').write_bytes((root/'products-metadata.json').read_bytes())
          PY
          mkdir -p build/ios-simulator/Build
          COPYFILE_DISABLE=1 tar -xzf ../ios-prebuilt/UITestProducts.tar.gz -C build/ios-simulator/Build Products
          python3 - <<'PY'
          import os,pathlib,plistlib
          root=pathlib.Path('build/ios-simulator/Build');products=root/'Products'
          assert not (root/'._Products').exists(),'Verified root AppleDouble must never be extracted'
          assert len(list(products.glob('*.xctestrun')))==1
          for name in ('App.app','AppUITests-Runner.app'):
              bundle=products/'Debug-iphonesimulator'/name;info=plistlib.loads((bundle/'Info.plist').read_bytes())
              executable=info['CFBundleExecutable'];assert pathlib.PurePosixPath(executable).name==executable
              binary=bundle/executable;assert binary.is_file() and os.access(binary,os.X_OK),'Products executable mode must be preserved'
          PY
      - name: Verify production host isolation
        run: python3 ../harness/ios-isolate.py enable
      - name: Select and boot an existing matching iPhone
        run: |
          set -euo pipefail
          test "$TUTAM_QA_HOSTS_ISOLATED" = 1
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,os,re,sys; d=json.load(sys.stdin)["devices"]; v=re.escape(os.environ["IOS_RUNTIME"].replace(".","-")); matches=[x for k in sorted(d) if re.search(r"\.iOS-"+v+r"(?:-|$)",k) for x in d[k] if x.get("isAvailable") and x["name"].startswith("iPhone") and "Duo" not in x["name"]]; assert matches,"No existing simulator for requested runtime"; print(matches[0]["udid"])')
          echo "TUTAM_QA_SIMULATOR=$device" >> "$GITHUB_ENV"
          if ! xcrun simctl list devices booted | grep -Fq "$device"; then xcrun simctl boot "$device"; fi
          xcrun simctl bootstatus "$device" -b
          TUTAM_QA_READINESS_DEVICE="$device" python3 - <<'PY'
          import json,os,pathlib,subprocess
          qa=pathlib.Path('qa-evidence');qa.mkdir(parents=True,exist_ok=True)
          evidence=pathlib.Path('build/release-evidence');evidence.mkdir(parents=True,exist_ok=True)
          device=os.environ['TUTAM_QA_READINESS_DEVICE']
          records=[]
          def capture(command,name,timeout=30):
              try:
                  result=subprocess.run(command,timeout=timeout,check=True,capture_output=True,text=True,errors='replace')
                  stdout,stderr=result.stdout,result.stderr;ok=True;error=None
              except (subprocess.CalledProcessError,subprocess.TimeoutExpired) as failure:
                  stdout,stderr=failure.stdout or '',failure.stderr or '';ok=False;error=str(failure)
              if isinstance(stdout,bytes):stdout=stdout.decode(errors='replace')
              if isinstance(stderr,bytes):stderr=stderr.decode(errors='replace')
              text='COMMAND: '+' '.join(command)+'\nSTDOUT:\n'+stdout+'\nSTDERR:\n'+stderr+'\n'
              if error:text+='ERROR: '+error+'\n'
              (qa/name).write_text(text)
              (evidence/name).write_text(text)
              records.append({'command':command,'passed':ok,'timeoutSeconds':timeout,'output':name,'error':error})
              return ok
          supported=capture(['xcrun','simctl','help','listapps'],'simulator-listapps-help.txt')
          # Help is diagnostic only. The actual installation-service query always runs once.
          ready=capture(['xcrun','simctl','listapps',device],'simulator-app-services-ready.txt',120)
          capture(['xcrun','simctl','list','devices','booted','-j'],'simulator-booted-devices.txt')
          capture(['xcrun','simctl','list','runtimes','-j'],'simulator-installed-runtimes.txt')
          capture(['sw_vers'],'simulator-host-os.txt')
          capture(['xcodebuild','-version'],'simulator-xcode-version.txt')
          result={'ready':ready,'ios':os.environ['IOS_RUNTIME'],'device':device,'records':records,
                  'stage':'pre-test infrastructure only','nativeAssertionsChanged':False,'perCaseWatchdogSeconds':750}
          for directory in (qa,evidence):(directory/'simulator-readiness.json').write_text(json.dumps(result,indent=2)+'\n')
          assert ready,'Simulator app installation services were not ready before native execution'
          PY
      - name: Run exact native group on fresh per-case installs
        run: MOBILE_SOURCE_MANIFEST_SHA256="$CURRENT_SOURCE_OVERLAY_MANIFEST_SHA256" python3 ../harness/run-ios-cases.py --group '${{ matrix.group }}'
      - name: Export readable evidence and enforce exact counts
        if: always()
        run: MOBILE_SOURCE_MANIFEST_SHA256="$CURRENT_SOURCE_OVERLAY_MANIFEST_SHA256" python3 ../harness/run-ios-cases.py --group '${{ matrix.group }}' --collect-only
      - name: Stop simulator before restoring resolution
        if: always()
        run: |
          set -euo pipefail
          if [[ -n "${TUTAM_QA_SIMULATOR:-}" ]]; then
            state=$(xcrun simctl list devices -j | python3 -c 'import json,os,sys; d=json.load(sys.stdin)["devices"]; print(next(x["state"] for v in d.values() for x in v if x["udid"]==os.environ["TUTAM_QA_SIMULATOR"]))')
            if [[ "$state" != Shutdown ]]; then xcrun simctl shutdown "$TUTAM_QA_SIMULATOR"; fi
          fi
          python3 ../harness/ios-isolate.py restore
      - name: Upload readable native evidence and raw results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ios-moderation-case-only-evidence-${{ matrix.ios }}-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/release-evidence/
          retention-days: 7
          if-no-files-found: error
  ios-gate:
    name: Require all 26 current iOS executions
    needs:
      - ios-cases
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IOS_CASES_RESULT: ${{ needs.ios-cases.result }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: harness
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          pattern: ios-moderation-case-only-evidence-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ios-native-evidence
      - name: Require every case once on both iOS versions
        run: |-
          python3 - <<'PY'
          import hashlib,json,os,pathlib,plistlib,runpy
          root=pathlib.Path('ios-native-evidence');root.mkdir(exist_ok=True)
          result={'status':'FAILED','expectedTests':26,'failedTests':None,'skippedTests':None,'groups':8}
          try:
              expected_count=int(os.environ['CURRENT_SOURCE_EXPECTED_FILE_COUNT']);added_count=int(os.environ['CURRENT_SOURCE_ADDED_FILE_COUNT'])
              sha=lambda path:hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
              assert sha('harness/run-ios-cases.py')==os.environ['IOS_CASE_RUNNER_SHA256']
              assert sha('harness/moderation-brand-overlay.json')==os.environ['CURRENT_SOURCE_OVERLAY_MANIFEST_SHA256']
              manifest=json.loads(pathlib.Path('harness/moderation-brand-overlay.json').read_bytes())
              assert manifest['phase']=='final' and manifest['readyForPublication'] is True
              assert manifest['currentExpectedMapSha256']==os.environ['CURRENT_SOURCE_EXPECTED_MAP_SHA256']
              assert manifest['currentExpectedFileCount']==expected_count and manifest['addedFileCount']==added_count
              assert manifest['fileCount']==int(os.environ['CURRENT_SOURCE_OVERLAY_FILE_COUNT'])
              module=runpy.run_path('harness/run-ios-cases.py');groups=module['GROUPS']
              assert {key:len(value) for key,value in groups.items()}=={'smoke':4,'extended':5,'personal':2,'snapshot':2}
              expected={(ios,group) for ios in ('18.5','27.0') for group in groups}
              summaries=list(root.rglob('native-ui-summary.json'))
              assert len(summaries)==8,'Expected exactly eight actual group summaries'
              assert os.environ['IOS_CASES_RESULT']=='success'
              seen=set();total=0;proof_sha=None;config_sha=None
              product_pins={"18.5":{"products_artifact_id":"14713655122","products_artifact_digest":"59656289d6877cf544501db41b5884bd129a78f2745fffc24a78c1cd6ed1ddbf","products_artifact_bytes":149209320,"products_metadata_sha256":"4b1264b5f585f44865382b981a10be9a279ca225f31a70f24640a627207d3e36","products_archive_sha256":"7e52fc74b114d267dc064304da164a89be96a364f461b811870191e581e4cee7","products_build_job_id":"136891184603"},"27.0":{"products_artifact_id":"14713610297","products_artifact_digest":"fbfb332c920c5efd001dda3500ef257bf38d1178c5484466037d558fd1f5a067","products_artifact_bytes":144026599,"products_metadata_sha256":"5d9932ca092302bd119e23d62364240a18c2b6733a052302afd5bb26722244d6","products_archive_sha256":"c0cc14b536aaed67912d148e3c9cf3c8abeed1eaa7358727c53ac205ac570d96","products_build_job_id":"136891184871"}}
              helper_path='scripts/lib/ios-google-config.mjs'
              helper_blob=json.loads(pathlib.Path('harness/mobile-current-manifest.json').read_bytes())['expected'][helper_path]
              for name in ('ui-fixes.json','current-follow-up.json','qa-test-follow-up.json','late-overlay.json','moderation-brand-overlay.json'):
                  for item in json.loads(pathlib.Path('harness',name).read_bytes())['files']:
                      if item['path']==helper_path:helper_blob=item['gitBlobSha1']
              for path in summaries:
                  data=json.loads(path.read_bytes());key=(data['ios'],data['group'])
                  assert key in expected and key not in seen
                  assert data['sourceManifestSha256']==os.environ['CURRENT_SOURCE_OVERLAY_MANIFEST_SHA256']
                  proof_path=path.parent/'source-overlays-proof.json';proof=json.loads(proof_path.read_bytes())
                  digest=sha(proof_path)
                  if proof_sha is None:proof_sha=digest
                  assert digest==proof_sha,'Source proofs differ between OS/group jobs'
                  assert proof['baseSourceManifestSha256']==os.environ['BASE_SOURCE_MANIFEST_SHA256']
                  assert proof['currentSourceOverlayManifestSha256']==os.environ['CURRENT_SOURCE_OVERLAY_MANIFEST_SHA256']
                  assert proof['currentSourceExpectedMapSha256']==os.environ['CURRENT_SOURCE_EXPECTED_MAP_SHA256']
                  assert proof['currentSourceExpectedFileCount']==expected_count and proof['currentSourceAddedFileCount']==added_count
                  assert proof['harnessSha256']==os.environ['IOS_HARNESS_SHA256'] and proof['caseRunnerSha256']==os.environ['IOS_CASE_RUNNER_SHA256']
                  assert proof['testMethodCount']==13
                  metadata=json.loads((path.parent/'products-metadata.json').read_bytes())
                  assert all(metadata[name]==value for name,value in proof.items())
                  assert metadata['sourceOverlaysProofSha256']==digest and metadata['ios']==data['ios']
                  assert metadata['workflowRunId']==os.environ['PRODUCTS_SOURCE_RUN_ID'] and metadata['workflowRunAttempt']==os.environ['PRODUCTS_SOURCE_RUN_ATTEMPT']
                  assert metadata['harnessRepositoryCommit']==os.environ['PRODUCTS_SOURCE_HEAD_SHA']
                  pins=product_pins[data['ios']];api=json.loads((path.parent/'prebuilt-source-verification.json').read_bytes());receipt=json.loads((path.parent/'prebuilt-products-verification.json').read_bytes())
                  assert api['sourceRunId']==receipt['sourceRunId']==os.environ['PRODUCTS_SOURCE_RUN_ID']
                  assert api['sourceRunAttempt']==receipt['sourceRunAttempt']==os.environ['PRODUCTS_SOURCE_RUN_ATTEMPT']
                  assert api['sourceHeadSha']==receipt['sourceHeadSha']==os.environ['PRODUCTS_SOURCE_HEAD_SHA'] and api['sourceRunStatus']=='completed'
                  assert len(api['sourceBuildJobs'])==2 and all(job['status']=='completed' and job['conclusion']=='success' for job in api['sourceBuildJobs'])
                  assert {str(job['id']) for job in api['sourceBuildJobs']}=={'136891184603','136891184871'}
                  assert str(api['artifact']['id'])==receipt['artifactId']==pins['products_artifact_id']
                  assert api['artifact']['digest']=='sha256:'+pins['products_artifact_digest'] and api['artifact']['expired'] is False
                  assert api['artifact']['size_in_bytes']==receipt['artifactBytes']==pins['products_artifact_bytes']
                  assert receipt['artifactDigest']==pins['products_artifact_digest'] and receipt['buildJobId']==pins['products_build_job_id']
                  assert receipt['metadataSha256']==sha(path.parent/'products-metadata.json')==pins['products_metadata_sha256']
                  assert receipt['archiveSha256']==metadata['archiveSha256']==pins['products_archive_sha256']
                  assert receipt['sourceOverlaysProofSha256']==digest==os.environ['PRODUCTS_SOURCE_PROOF_SHA256']
                  assert receipt['generatedIosInfoProofSha256']==os.environ['PRODUCTS_GENERATED_INFO_PROOF_SHA256']
                  assert receipt['currentTestRunId']==api['currentTestRunId']==os.environ['GITHUB_RUN_ID']
                  assert receipt['currentTestRunAttempt']==api['currentTestRunAttempt']==os.environ['GITHUB_RUN_ATTEMPT']
                  skipped=receipt['skippedRootMetadata'];assert len(skipped)<=1
                  if skipped:assert skipped==[{'name':'._Products','bytes':172,'sha256':os.environ['ROOT_APPLEDOUBLE_SHA256'],'magic':'0005160700020000'}]
                  assert receipt['extractionPolicy']=='Products subtree only; verified root AppleDouble is never extracted'
                  config_path=path.parent/'ios-info-build-config.json';config=json.loads(config_path.read_bytes())
                  digest_config=sha(config_path)
                  if config_sha is None:config_sha=digest_config
                  assert digest_config==config_sha==metadata['generatedIosInfoProofSha256']
                  assert config==metadata['generatedIosInfo'] and config['schemaVersion']==1 and config['transform']=='configureIosGoogle'
                  assert config['path']=='ios/App/App/Info.plist' and config['publicQaClientId']==os.environ['IOS_QA_GOOGLE_CLIENT_ID']
                  info_entry=next(item for item in proof['currentSourceRuntimeFiles'] if item['path']==config['path'])
                  assert config['sourceSha256']==info_entry['sha256']==sha(path.parent/'ios-info.original.plist')
                  assert config['expectedSha256']==config['actualSha256']==sha(path.parent/'ios-info.expected.plist')
                  assert config['sourceHelperPath']==helper_path and config['sourceHelperGitBlobSha1']==helper_blob
                  assert config['verifiedExactBytes'] is True
                  expected_info=plistlib.loads((path.parent/'ios-info.expected.plist').read_bytes())
                  assert config['productIdentity']=={'bundleId':'vn.quangtu.tutam','bundleName':'App','displayName':expected_info['CFBundleDisplayName'],'urlTypes':expected_info['CFBundleURLTypes']}
                  assert proof['simulatorReadinessPolicy']=={'command':'xcrun simctl listapps','timeoutSeconds':120,'stage':'pre-test infrastructure only','nativeAssertionsChanged':False,'perCaseWatchdogSeconds':750}
                  readiness=json.loads((path.parent/'simulator-readiness.json').read_bytes())
                  assert readiness['ready'] is True and readiness['ios']==data['ios'] and readiness['nativeAssertionsChanged'] is False
                  assert data['workflowRunId']==os.environ['GITHUB_RUN_ID'] and data['workflowRunAttempt']==os.environ['GITHUB_RUN_ATTEMPT']
                  assert data['completeAndPassed'] is True
                  records=data['records'];identifiers=[record['identifier'] for record in records]
                  assert identifiers==groups[data['group']] and all(module['passed'](record) for record in records)
                  assert all(record['freshInstallCompleted'] is True and record['xcodeExitCode']==0 for record in records)
                  count=len(identifiers)
                  assert data['passedTests']==data['totalTestCount']==data['expectedTests']==count
                  assert data['failedTests']==data['skippedTests']==0
                  seen.add(key);total+=count
              assert seen==expected and total==26
              result.update({'status':'PASSED','passedTests':26,'failedTests':0,'skippedTests':0,
               'currentSourceOverlayManifestSha256':os.environ['CURRENT_SOURCE_OVERLAY_MANIFEST_SHA256'],
               'currentSourceExpectedMapSha256':os.environ['CURRENT_SOURCE_EXPECTED_MAP_SHA256'],
               'harnessSha256':os.environ['IOS_HARNESS_SHA256'],'caseRunnerSha256':os.environ['IOS_CASE_RUNNER_SHA256'],
               'sourceOverlaysProofSha256':proof_sha,'generatedIosInfoProofSha256':config_sha,
               'producerRunId':os.environ['PRODUCTS_SOURCE_RUN_ID'],'producerRunAttempt':os.environ['PRODUCTS_SOURCE_RUN_ATTEMPT'],
               'producerCommit':os.environ['PRODUCTS_SOURCE_HEAD_SHA'],'currentTestRunId':os.environ['GITHUB_RUN_ID'],
               'currentTestRunAttempt':os.environ['GITHUB_RUN_ATTEMPT']})
          except Exception as error:
              result['failureType']=type(error).__name__;result['failure']=str(error)[:2000]
              raise
          finally:
              (root/'full-ios-gate.json').write_text(json.dumps(result,indent=2)+'\n')
          print('Verified26actual native iOS executions,0failures,0skips')
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ios-moderation-case-only-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ios-native-evidence/full-ios-gate.json
          if-no-files-found: warn
