# Reuses successful immutable producer builds; producer44919158999 remains an infrastructure failure with no native cases executed.
name: Full iOS cases reusing verified moderation Products
on:
  workflow_dispatch: null
  push:
    branches:
      - codex/full-mobile-audit-20261121
    paths:
      - .github/workflows/moderation-ios-cases.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: moderation-ios-case-only-${{ github.ref }}
  cancel-in-progress: false
