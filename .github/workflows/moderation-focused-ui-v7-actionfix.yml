          ref: 166d0aeb43341da6f907e096f80a003b49d3be89
          path: app
          persist-credentials: false
      - name: Require final immutable source pins and apply every reviewed source layer
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,subprocess
          assert os.environ['GITHUB_ACTIONS']=='true' and os.environ['RUNNER_ENVIRONMENT']=='github-hosted'
          assert os.environ['PUBLISH_STATE']=='READY_FOR_V7_ACTIONFIX_UI_QA','NOT PUBLISHABLE: root must pin the final reviewed source'
          h=pathlib.Path('../harness')
          pins={'BASE_SOURCE_MANIFEST_SHA256':'mobile-current-manifest.json','UI_FIXES_MANIFEST_SHA256':'ui-fixes.json','CURRENT_FOLLOW_UP_MANIFEST_SHA256':'current-follow-up.json','QA_TEST_FOLLOW_UP_MANIFEST_SHA256':'qa-test-follow-up.json','LATE_OVERLAY_MANIFEST_SHA256':'late-overlay.json','CURRENT_SOURCE_OVERLAY_MANIFEST_SHA256':'moderation-v7-overlay.json','CURRENT_SOURCE_OVERLAY_HELPER_SHA256':'apply-moderation-v7.py','TUTAM_RUNTIME_MANIFEST_SHA256':'runtime-data-manifest.json','RUNTIME_DATA_HELPER_SHA256':'apply-runtime-data.py','TUTAM_TEST_SUPPORT_MANIFEST_SHA256':'test-support-manifest.json','TEST_SUPPORT_HELPER_SHA256':'apply-test-support.py','WEBKIT_CONFIG_SHA256':'ui-webkit.config.ts','WEBKIT_FIXTURE_SHA256':'webkit-persistent-fixtures.ts','WEBKIT_STAGE_SHA256':'stage-webkit-persistent.py','TEST_AMENDMENT_MANIFEST_SHA256':'v7-ui-action-fix.json','TEST_AMENDMENT_HELPER_SHA256':'apply-v7-ui-action-fix.py'}
          for variable,name in pins.items():
              expected=os.environ[variable]
              assert re.fullmatch(r'[0-9a-f]{64}',expected),'Unfilled publication pin: '+variable
              assert hashlib.sha256((h/name).read_bytes()).hexdigest()==expected,name
          assert re.fullmatch(r'[0-9a-f]{64}',os.environ['CURRENT_SOURCE_EXPECTED_MAP_SHA256'])
          for key in ('CURRENT_SOURCE_EXPECTED_FILE_COUNT','CURRENT_SOURCE_ADDED_FILE_COUNT','CURRENT_SOURCE_OVERLAY_FILE_COUNT'):
              assert re.fullmatch(r'[1-9][0-9]*',os.environ[key]),'Unfilled count: '+key
          source=json.loads((h/'moderation-v7-overlay.json').read_bytes())
          base=json.loads((h/'mobile-current-manifest.json').read_bytes())
          assert source['phase']=='final' and source['readyForPublication'] is True
          assert source['snapshotRevision']==os.environ['CURRENT_SOURCE_SNAPSHOT_REVISION']
          assert source['representsCurrentMainAtCapture'] is True and source['sourceConcurrencyGuard']['matched'] is True
          assert source['archive']=='moderation-v7-overlay.tar.gz' and source['archiveSha256']==os.environ['CURRENT_SOURCE_ARCHIVE_SHA256']
          assert hashlib.sha256((h/source['archive']).read_bytes()).hexdigest()==os.environ['CURRENT_SOURCE_ARCHIVE_SHA256']
          assert source['runtimeFileCount']==int(os.environ['CURRENT_SOURCE_RUNTIME_FILE_COUNT'])
          assert source['fileCount']-source['runtimeFileCount']==int(os.environ['CURRENT_SOURCE_TEST_FILE_COUNT'])
          assert source['currentExpectedFileCount']==int(os.environ['CURRENT_SOURCE_EXPECTED_FILE_COUNT'])==len(base['expected'])+int(os.environ['CURRENT_SOURCE_ADDED_FILE_COUNT'])
          assert source['addedFileCount']==int(os.environ['CURRENT_SOURCE_ADDED_FILE_COUNT'])
          assert source['fileCount']==int(os.environ['CURRENT_SOURCE_OVERLAY_FILE_COUNT'])
          assert source['currentExpectedMapSha256']==os.environ['CURRENT_SOURCE_EXPECTED_MAP_SHA256']
          amendment=json.loads((h/'v7-ui-action-fix.json').read_bytes())
          assert amendment['producerManifestSha256']==os.environ['CURRENT_SOURCE_OVERLAY_MANIFEST_SHA256']
          assert amendment['producerExpectedMapSha256']==os.environ['CURRENT_SOURCE_EXPECTED_MAP_SHA256']
          assert amendment['fileCount']==2 and amendment['changedRuntimeFiles']==0 and amendment['unchangedProducerFiles']==3290 and amendment['unchangedRuntimeFiles']==89
          assert amendment['executionExpectedMapSha256']==os.environ['TEST_AMENDMENT_EXECUTION_MAP_SHA256']
          assert amendment['archiveSha256']==os.environ['TEST_AMENDMENT_ARCHIVE_SHA256']
          assert hashlib.sha256((h/amendment['archive']).read_bytes()).hexdigest()==os.environ['TEST_AMENDMENT_ARCHIVE_SHA256']
          assert subprocess.check_output(['git','--no-optional-locks','-C',str(h),'rev-parse','HEAD'],text=True).strip()==os.environ['GITHUB_SHA']
          PY
          python3 ../harness/apply-current.py .
          python3 ../harness/apply-ui-fixes.py .
          python3 ../harness/apply-current-follow-up.py .
          python3 ../harness/apply-qa-test-follow-up.py .
          python3 ../harness/apply-late-overlay.py .
          python3 ../harness/apply-moderation-v7.py .
          python3 ../harness/apply-v7-ui-action-fix.py .
          python3 ../harness/apply-runtime-data.py .
          python3 ../harness/apply-test-support.py .
      - name: Verify the complete final source map plus runtime and test support
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          h=pathlib.Path('../harness');q=pathlib.Path('qa-evidence');out=pathlib.Path('build/github-moderation-ui-v7-actionfix-evidence');out.mkdir(parents=True,exist_ok=True)
          sha=lambda data:hashlib.sha256(data).hexdigest()
          blob=lambda data:hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          manifest=json.loads((h/'moderation-v7-overlay.json').read_bytes())
          expected_raw=(q/'moderation-brand-expected.json').read_bytes();expected=json.loads(expected_raw)
          report=json.loads((q/'moderation-brand-source-verification.json').read_bytes())
