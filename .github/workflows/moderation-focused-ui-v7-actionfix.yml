      QA_TEST_FOLLOW_UP_MANIFEST_SHA256: eb6dabe803ec93016364795f807a47fe91641286e2d81e77ce8afafb9431a3aa
      LATE_OVERLAY_MANIFEST_SHA256: 934ffb0237675171025c5c9e48323043f68573e4e7cd706f9fc658d80d925ccd
      CURRENT_SOURCE_OVERLAY_MANIFEST_SHA256: 8d2ab07f5287323dd52a93e69259962c94e7793dd05d8f65956e5dd6df58d9ab
      CURRENT_SOURCE_OVERLAY_HELPER_SHA256: 5ca2475fe17f05d96ab276b107a8b786c59cfd044f21e08eb06041e4c8387f6f
