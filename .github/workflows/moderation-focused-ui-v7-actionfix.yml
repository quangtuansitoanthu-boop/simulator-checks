      TEST_AMENDMENT_MANIFEST_SHA256: 98b09e1ff9d6c065e6878d6a241595d8d1fcfac44cb62315a9f1fcf9b2e871c9
      TEST_AMENDMENT_HELPER_SHA256: 75521faa3a5854fb3abd0ea249320ed315373aad32830db8a54078194aac4e11
