              "moderation pagination reuses its principal cache and keeps stale decisions blocked": "tests/e2e/admin-community-moderation.spec.ts",
              "session loss clears moderation context and closes a private rejection draft": "tests/e2e/admin-community-moderation.spec.ts",
              "[moderation48h] cold and repeated warm notification links reopen the mindful queue after manual tabs": "tests/e2e/admin-community-moderation.spec.ts",
              "[moderation48h] bulk review freezes all filtered pages and resumes explicitly at 375px in light mode": "tests/e2e/admin-community-moderation.spec.ts",
              "[moderation48h] bulk review freezes all filtered pages and resumes explicitly at 375px in dark mode": "tests/e2e/admin-community-moderation.spec.ts",
              "[moderation48h] bulk review freezes all filtered pages and resumes explicitly at 1440px in light mode": "tests/e2e/admin-community-moderation.spec.ts",
              "[moderation48h] bulk review freezes all filtered pages and resumes explicitly at 1440px in dark mode": "tests/e2e/admin-community-moderation.spec.ts",
              "[moderation48h] real local D1 keeps two submissions private until admin approval, rejection or deletion": "tests/e2e/mindful-moderation-48h.spec.ts",
              "[moderation48h] 403, 429 and 503 preserve one draft and client ID until a real local D1 retry succeeds": "tests/e2e/mindful-moderation-48h.spec.ts",
              "[moderation48h] review text, pending deadline and Back remain usable at 375px in light mode": "tests/e2e/mindful-moderation-48h.spec.ts",
              "[moderation48h] review text, pending deadline and Back remain usable at 375px in dark mode": "tests/e2e/mindful-moderation-48h.spec.ts",
              "[moderation48h] review text, pending deadline and Back remain usable at 1440px in light mode": "tests/e2e/mindful-moderation-48h.spec.ts",
              "[moderation48h] review text, pending deadline and Back remain usable at 1440px in dark mode": "tests/e2e/mindful-moderation-48h.spec.ts",
              "local D1 delivers prayers and rejoicing only to the post owner, without duplicate notifications": "tests/e2e/mindful-notifications-local.spec.ts",
              "both private journal share actions require confirmation and cancel sends no request": "tests/e2e/practice-upgrade.spec.ts",
              "sharing and template reaction each send one mutation without a feed refetch": "tests/e2e/practice-upgrade.spec.ts",
              "sends both journal kinds through the iOS bridge and preserves a refused draft for retry": "tests/e2e/practice-upgrade.spec.ts"
          }
          files=list(dict.fromkeys(cases.values()))
          selection=['node','node_modules/@playwright/test/cli.js','test',*files,'--config=tests/e2e/github-moderation-focused.config.ts','--project=desktop-1440-light','--grep=(?:'+'|'.join(re.escape(title) for title in cases)+')$','--workers=1','--retries=0']
          env=os.environ.copy();env['PLAYWRIGHT_JSON_OUTPUT_FILE']=str(out/'selected.json')
          subprocess.run(selection+['--list','--reporter=json'],env=env,check=True)
          selected=json.loads((out/'selected.json').read_text())
          def specs(suites):
              return [spec for suite in suites for spec in suite.get('specs',[])]+[spec for suite in suites for spec in specs(suite.get('suites',[]))]
          listed=specs(selected.get('suites',[]))
          assert len(listed)==20 and {spec['title'] for spec in listed}==set(cases) and not selected.get('errors'),'Expected exactly the twenty reviewed moderation journeys'
          for spec in listed:
              assert spec['file'].replace('\\','/').endswith(cases[spec['title']]) or spec['file'].replace('\\','/').endswith(cases[spec['title']].removeprefix('tests/e2e/')),'Selected journey file differs'
              assert len(spec['tests'])==1 and spec['tests'][0]['projectName']=='desktop-1440-light','Each journey must select exactly the existing desktop light project'
          processes=[];result=1;failure=None;readiness={'ready':False,'attempts':[]};stopped=False
          def members(group):
              rows=subprocess.run(['/bin/ps','-axo','pid=,pgid=,stat='],capture_output=True,text=True,check=True,timeout=10).stdout.splitlines()
              return [int(parts[0]) for row in rows if len(parts:=row.split())>=3 and int(parts[1])==group and not parts[2].startswith('Z')]
          def stop(process,label):
              group=process.pid
              assert group>1 and group!=os.getpgrp()
              before=members(group)
              if before:
                  os.killpg(group,signal.SIGTERM)
                  end=time.monotonic()+10
                  while members(group) and time.monotonic()<end:time.sleep(.2)
                  if members(group):
                      os.killpg(group,signal.SIGKILL)
                      end=time.monotonic()+3
                      while members(group) and time.monotonic()<end:time.sleep(.1)
              remaining=members(group)
              assert not remaining,'Managed process group still running'
              return {'label':label,'pid':process.pid,'pgid':group,'before':before,'remaining':remaining,'stopped':True}
          def interrupted(signum,frame):raise RuntimeError('CI interruption signal '+str(signum))
          signal.signal(signal.SIGINT,interrupted);signal.signal(signal.SIGTERM,interrupted)
          try:
              with (out/'runtime.log').open('w') as runtime_log,(out/'test.log').open('w') as test_log:
                  runtime=subprocess.Popen(['node','tests/e2e/start-local-runtime.mjs'],stdin=subprocess.DEVNULL,stdout=runtime_log,stderr=subprocess.STDOUT,start_new_session=True)
                  processes.append((runtime,'runtime'));assert os.getpgid(runtime.pid)==runtime.pid
                  (out/'runtime-owner.json').write_text(json.dumps({'pid':runtime.pid,'pgid':runtime.pid,'platform':sys.platform},indent=2))
                  opener=urllib.request.build_opener(urllib.request.ProxyHandler({}));started=time.monotonic();deadline=started+120
                  while time.monotonic()<deadline:
                      assert runtime.poll() is None,'Local runtime exited before readiness'
                      attempt={'elapsedSeconds':round(time.monotonic()-started,2)}
                      try:
                          for label,path in [('health','/api/health'),('root','/')]:
                              remaining=deadline-time.monotonic()
                              if remaining<=0:raise TimeoutError('Runtime readiness deadline reached')
                              request=urllib.request.Request('http://127.0.0.1:8787'+path,headers={'Host':'localhost:8787','Cache-Control':'no-store'})
                              with opener.open(request,timeout=min(3,remaining)) as response:
                                  body=response.read(262144);status=response.status;kind=response.headers.get('content-type','')
                              attempt[label]={'status':status,'contentType':kind,'bytes':len(body)}
                              assert status==200
                              if label=='root':assert 'text/html' in kind and b'<html' in body.lower()
                          readiness['ready']=True;readiness['attempts'].append(attempt);break
                      except Exception as error:
                          attempt['error']=str(error);readiness['attempts'].append(attempt)
                      time.sleep(min(1,max(0,deadline-time.monotonic())))
                  assert readiness['ready'],'Local runtime did not serve health plus root HTML within 120s'
                  env['PLAYWRIGHT_JSON_OUTPUT_FILE']=str(out/'results.json')
                  tests=subprocess.Popen(selection+['--reporter=line,json'],env=env,stdout=test_log,stderr=subprocess.STDOUT,start_new_session=True)
                  processes.append((tests,'test-cli'));result=tests.wait(timeout=900)
          except Exception as error:
              failure=str(error)
          finally:
              cleanup=[]
              try:
                  for process,label in reversed(processes):cleanup.append(stop(process,label))
                  stopped=True
              finally:
                  (out/'runtime-readiness.json').write_text(json.dumps(readiness,indent=2))
                  (out/'runtime-stop.json').write_text(json.dumps({'stopped':stopped,'groups':cleanup,'failure':failure},indent=2))
          print(json.dumps({'runtimeReady':readiness['ready'],'testExitCode':result,'stopped':stopped,'failure':failure}))
          assert stopped and failure is None and result==0,'Moderation twenty-journey test or local runtime failed'
          PY
      - name: Require twenty actual passes with zero skips retries or unexpected errors
        if: always()
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          out=pathlib.Path('build/github-moderation-ui-v7-actionfix-evidence');out.mkdir(parents=True,exist_ok=True)
          path=out/'results.json';selected_path=out/'selected.json'
          data=json.loads(path.read_text()) if path.is_file() else {'errors':['Missing results'],'stats':{}}
          selected=json.loads(selected_path.read_text()) if selected_path.is_file() else {'errors':['Missing selection'],'suites':[]}
          def specs(suites):
              return [sp for su in suites for sp in su.get('specs',[])]+[sp for su in suites for sp in specs(su.get('suites',[]))]
          listed=specs(selected.get('suites',[]));actual=specs(data.get('suites',[]));stats=data.get('stats',{})
          identity=lambda sp:(sp['file'].replace('\\','/'),sp['title'])
          valid=(len(listed)==len(actual)==20 and {identity(sp) for sp in listed}=={identity(sp) for sp in actual}
            and stats.get('expected')==20 and stats.get('unexpected')==0 and stats.get('skipped')==0 and stats.get('flaky')==0
            and not selected.get('errors') and not data.get('errors'))
          for spec in actual:
              valid=valid and spec.get('ok') is True and len(spec.get('tests',[]))==1
              for test in spec.get('tests',[]):
                  valid=valid and test.get('projectName')=='desktop-1440-light' and test.get('expectedStatus')=='passed' and test.get('status')=='expected' and len(test.get('results',[]))==1
                  for result in test.get('results',[]):valid=valid and result.get('status')=='passed' and result.get('retry')==0 and not result.get('errors')
          readiness=out/'runtime-readiness.json';cleanup=out/'runtime-stop.json';source=out/'source-overlays-proof.json'
          valid=valid and readiness.is_file() and cleanup.is_file() and source.is_file()
          if valid:
              valid=json.loads(readiness.read_text()).get('ready') is True and json.loads(cleanup.read_text()).get('stopped') is True and json.loads(source.read_text()).get('status')=='EXACT_V7_UI_ACTIONFIX_EXECUTION_SOURCE_VERIFIED'
              execution_proof=json.loads(source.read_text())
              valid=valid and execution_proof.get('testAmendmentManifestSha256')==os.environ['TEST_AMENDMENT_MANIFEST_SHA256'] and execution_proof.get('executionExpectedMapSha256')==os.environ['TEST_AMENDMENT_EXECUTION_MAP_SHA256'] and execution_proof.get('unchangedRuntimeFiles')==89
          summary={'snapshotRevision':os.environ['CURRENT_SOURCE_SNAPSHOT_REVISION'],'sourceManifestSha256':os.environ['CURRENT_SOURCE_OVERLAY_MANIFEST_SHA256'],'scope':'frozen_V7_UI_with_ten_test_only_view_and_detail_action_locators','testAmendmentManifestSha256':os.environ['TEST_AMENDMENT_MANIFEST_SHA256'],'executionExpectedMapSha256':os.environ['TEST_AMENDMENT_EXECUTION_MAP_SHA256'],'engine':os.environ['TUTAM_UI_ENGINE'],'expectedCases':20,'actualCases':len(actual),'stats':stats,'errors':data.get('errors',[]),'gate':'PASSED' if valid else 'FAILED'}
          (out/'moderation-ui-summary.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          assert valid,'Twenty-case moderation regression gate did not pass'
          PY
      - name: Restore isolated host resolution only after managed runtime stops
        if: always()
        run: |
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          out=pathlib.Path('build/github-moderation-ui-v7-actionfix-evidence');owner=out/'runtime-owner.json';state=out/'runtime-stop.json'
          assert not owner.exists() or state.exists() and json.loads(state.read_text())['stopped'],'Do not restore network while a managed process group is active'
          backup=pathlib.Path(os.environ['RUNNER_TEMP'])/'moderation-ui-v7-actionfix-hosts.backup'
          if backup.exists():
              subprocess.run(['sudo','cp',str(backup),'/etc/hosts'],check=True)
              assert pathlib.Path('/etc/hosts').read_bytes()==backup.read_bytes()
          PY
