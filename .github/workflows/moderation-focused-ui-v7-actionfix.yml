          assert report['currentExpectedFileCount']==manifest['currentExpectedFileCount']==len(expected)==int(os.environ['CURRENT_SOURCE_EXPECTED_FILE_COUNT'])
          assert report['currentExpectedMapSha256']==manifest['currentExpectedMapSha256']==sha(expected_raw)==os.environ['CURRENT_SOURCE_EXPECTED_MAP_SHA256']
          assert report['files']==manifest['files'] and report['nativeFixtureOwnership']==manifest['nativeFixtureOwnership']
          assert report['v7DebugRevision']==manifest['v7DebugRevision']
          amendment_manifest=json.loads((h/'v7-ui-action-fix.json').read_bytes())
          amendment_raw=(q/'v7-ui-action-fix-verification.json').read_bytes();amendment=json.loads(amendment_raw)
          execution_raw=(q/'v7-ui-action-fix-expected.json').read_bytes();execution_expected=json.loads(execution_raw)
          assert amendment['status']=='EXACT_V7_UI_ACTION_TEST_AMENDMENT_VERIFIED'
          assert amendment['testAmendmentManifestSha256']==os.environ['TEST_AMENDMENT_MANIFEST_SHA256']
          assert amendment['archiveSha256']==os.environ['TEST_AMENDMENT_ARCHIVE_SHA256']
          assert amendment['producerManifestSha256']==os.environ['CURRENT_SOURCE_OVERLAY_MANIFEST_SHA256']
          assert amendment['producerExpectedMapSha256']==sha(expected_raw)==os.environ['CURRENT_SOURCE_EXPECTED_MAP_SHA256']
          assert amendment['producerSourceProofSha256']==sha((q/'moderation-brand-source-verification.json').read_bytes()) and amendment['producerProofsUnchanged'] is True
          assert amendment['producerBytesVerifiedBeforeAmendment']==3292 and amendment['executionSourceFiles']==3292
          assert amendment['fileCount']==2 and amendment['unchangedProducerFiles']==3290 and amendment['unchangedRuntimeFiles']==89 and amendment['changedRuntimeFiles']==0
          assert amendment['files']==amendment_manifest['files']
          assert sha(execution_raw)==amendment['executionExpectedMapSha256']==amendment_manifest['executionExpectedMapSha256']==os.environ['TEST_AMENDMENT_EXECUTION_MAP_SHA256']
          amended_paths={row['path'] for row in amendment_manifest['files']}
          assert amended_paths=={'tests/e2e/admin-community-moderation.spec.ts','tests/e2e/mindful-moderation-48h.spec.ts'}
          assert set(execution_expected)==set(expected) and len(execution_expected)==3292
          assert {name for name in expected if expected[name]!=execution_expected[name]}==amended_paths
          assert sum(expected[name]==execution_expected[name] for name in expected)==3290
          assert len(manifest['runtimePaths'])==89 and all(expected[name]==execution_expected[name] for name in manifest['runtimePaths'])
          integration_expected={
            'src/lib/components/admin/community/AdminModerationQueue.svelte':'8f0c42f88e0cc4e7c1d62294c1df62fb532b63623428d7ef8497963a5c6c76d8',
            'src/lib/data/offline-album-plays.json':'a8747c30f4d50f144c2a8b4386333eb10dbf01bfde4cc0bb16dfbff0c92a1fe4',
            'ios/App/App/TuTapBridgeViewController.swift':'c4345a5c134cde84a7d790dce14cfb7299c911a9dc2957b866b8d36340a935ce',
            'scripts/lib/ios-local-notifications-patch.mjs':'17b2ce683a71e44e25f55e0a912c36dadd47018b7d9ae678e407158136938922',
            'tests/deployment/ios-local-notifications-patch.test.ts':'94ae8a2f4bf8695f70a4b506501ac0e8259355fcaf8e1dfd48f535f6ac742944',
          }
          for name,wanted in integration_expected.items():
              item=next(row for row in manifest['files'] if row['path']==name)
              assert item['sha256']==wanted and sha(pathlib.Path(name).read_bytes())==wanted,'Current MAIN integration mismatch: '+name
          assert {row['path'] for row in manifest['v7DebugRevision']['debugOwnerFiles']}==set(integration_expected)-{'src/lib/components/admin/community/AdminModerationQueue.svelte','src/lib/data/offline-album-plays.json'}
          for name,wanted in execution_expected.items():
              path=pathlib.Path(name)
              assert path.is_file() and not path.is_symlink() and blob(path.read_bytes())==wanted,'Final source differs: '+name
          layers=[]
          for name,variable,proof_name,status in [
           ('ui-fixes.json','UI_FIXES_MANIFEST_SHA256','ui-fixes-verification.json','EXACT_UI_FIXES_VERIFIED'),
           ('current-follow-up.json','CURRENT_FOLLOW_UP_MANIFEST_SHA256','current-follow-up-verification.json','EXACT_CURRENT_FOLLOW_UP_VERIFIED'),
           ('qa-test-follow-up.json','QA_TEST_FOLLOW_UP_MANIFEST_SHA256','qa-test-follow-up-verification.json','EXACT_QA_TEST_FOLLOW_UP_VERIFIED'),
           ('late-overlay.json','LATE_OVERLAY_MANIFEST_SHA256','late-overlay-verification.json','EXACT_LATE_OVERLAY_VERIFIED'),
           ('moderation-v7-overlay.json','CURRENT_SOURCE_OVERLAY_MANIFEST_SHA256','moderation-brand-source-verification.json','EXACT_MODERATION_BRAND_SOURCE_VERIFIED')]:
              layer=json.loads((h/name).read_bytes());proof=json.loads((q/proof_name).read_bytes())
              assert proof['status']==status and proof['manifestSha256']==os.environ[variable]
              assert proof.get('mode','all')=='all' and proof['fileCount']==layer['fileCount']
              if 'archiveSha256' in proof:assert proof['archiveSha256']==layer['archiveSha256']
              layers.append({'manifest':name,'sha256':os.environ[variable],'archiveSha256':layer['archiveSha256'],'fileCount':layer['fileCount']})
          runtime=json.loads((q/'runtime-data-verification.json').read_bytes());support=json.loads((q/'test-support-verification.json').read_bytes())
          assert runtime['status']=='EXACT_RUNTIME_DATA_VERIFIED' and runtime['fileCount']==7 and runtime['manifestSha256']==os.environ['TUTAM_RUNTIME_MANIFEST_SHA256']
          assert support['status']=='EXACT_TEST_SUPPORT_VERIFIED' and support['fileCount']==2 and support['manifestSha256']==os.environ['TUTAM_TEST_SUPPORT_MANIFEST_SHA256']
          proof={'status':'EXACT_V7_UI_ACTIONFIX_EXECUTION_SOURCE_VERIFIED','harnessCommit':os.environ['GITHUB_SHA'],'baseManifestSha256':os.environ['BASE_SOURCE_MANIFEST_SHA256'],'sourceManifestSha256':os.environ['CURRENT_SOURCE_OVERLAY_MANIFEST_SHA256'],'sourceExpectedMapSha256':sha(execution_raw),'verifiedSourceFiles':len(execution_expected),'sourceMapRole':'two-test-amended-execution-before-approved-browser-fixture-staging','producerManifestSha256':os.environ['CURRENT_SOURCE_OVERLAY_MANIFEST_SHA256'],'producerExpectedMapSha256':sha(expected_raw),'producerSourceProofSha256':amendment['producerSourceProofSha256'],'testAmendmentManifestSha256':os.environ['TEST_AMENDMENT_MANIFEST_SHA256'],'testAmendmentArchiveSha256':os.environ['TEST_AMENDMENT_ARCHIVE_SHA256'],'executionExpectedMapSha256':sha(execution_raw),'unchangedProducerFiles':3290,'unchangedRuntimeFiles':89,'changedRuntimeFiles':0,'amendedTestPaths':sorted(amended_paths),'addedFiles':manifest['addedFileCount'],'layers':layers,'runtimeFiles':runtime['files'],'testSupportFiles':support['files'],'nativeHarnessOverridesApplied':False,'currentMainIntegration':integration_expected,'snapshotRevision':manifest['snapshotRevision'],'sourceArchiveSha256':manifest['archiveSha256'],'representsCurrentMainAtCapture':True,'nativeExecutionClaimed':False,'priorV4UiSuccessDoesNotValidateThisSnapshot':True}
          (out/'source-overlays-proof.json').write_text(json.dumps(proof,indent=2))
          for path in q.glob('*verification.json'):(out/path.name).write_bytes(path.read_bytes())
          (out/'moderation-brand-expected.json').write_bytes(expected_raw)
          (out/'v7-ui-action-fix-expected.json').write_bytes(execution_raw)
          (out/'v7-ui-action-fix-manifest.json').write_bytes((h/'v7-ui-action-fix.json').read_bytes())
          print(json.dumps({'status':proof['status'],'sourceFiles':len(expected),'runtimeFiles':7,'testSupportFiles':2}))
          PY
      - uses: actions/setup-node@v6
        with: {node-version: 24, cache: npm, cache-dependency-path: app/package-lock.json}
      - name: Install locked packages and the selected existing browser
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx playwright install --with-deps "$TUTAM_UI_BROWSER"
      - name: Build canonical local Cloudflare application
        run: npm run build
