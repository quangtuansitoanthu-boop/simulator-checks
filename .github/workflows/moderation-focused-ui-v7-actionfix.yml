# Source frozen for isolated GitHub QA; no production deployment.
name: Frozen V7 UI with ten view and detail-action locator amendments
on:
  workflow_dispatch:
  push:
    branches: ['codex/full-mobile-audit-20261121']
    paths: ['.github/workflows/moderation-focused-ui-v7-actionfix.yml']
permissions:
  contents: read
concurrency:
  group: moderation-focused-ui-v7-actionfix-${{ github.ref }}
  cancel-in-progress: false
jobs:
  moderation:
    name: V7 view and detail-action amendment UI ${{ matrix.engine }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - engine: chromium
            runner: ubuntu-24.04
            browser: chromium
          - engine: webkit
            runner: macos-15
            browser: webkit
    env:
      PUBLISH_STATE: READY_FOR_V7_ACTIONFIX_UI_QA
      CI: 'true'
      SVELTEKIT_BASE_URL: http://localhost:8787
      NODE_OPTIONS: --dns-result-order=ipv4first
      TUTAM_E2E_LOCAL_ONLY: '1'
      TUTAM_E2E_PREBUILT: '1'
      TUTAM_E2E_DEV_API: '1'
      TUTAM_E2E_RUNTIME_PORT: '8787'
      TUTAM_E2E_PROXY_PORT: '8799'
      WRANGLER_SEND_METRICS: 'false'
      DO_NOT_TRACK: '1'
      TUTAM_UI_ENGINE: ${{ matrix.engine }}
      TUTAM_UI_BROWSER: ${{ matrix.browser }}
      WRANGLER_LOG_PATH: ${{ github.workspace }}/app/build/github-moderation-ui-v7-actionfix-evidence/wrangler-user.log
      BASE_SOURCE_MANIFEST_SHA256: 043ca01be793d63f7224e8fbb72871c422b683cc879ea3f0a92087e2acbacfe7
      UI_FIXES_MANIFEST_SHA256: b09de0096afa6eb377b1a24725682d18a7f30f37037c830fcf943dc2aa3de295
