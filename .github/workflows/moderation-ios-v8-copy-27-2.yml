# Comparison only; previous iOS27.0 actual white failure remains a failure.
# Optional OS collector stays27.0-only and may be unavailable; direct AppQA is retained.
# REVIEW ARTIFACT: coordinator publishes only after static review.
# Reuse exact V8 Products; original failed/infra producer outcomes remain unchanged.
# Recovery is pre-test infrastructure only; this does not claim a Copy product fix.
name: Compare original V8 Copy on existing iOS27.2
